<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RumyFriend Jr</title>
<link rel="canonical" href="https://jr.rumyfriend.com/">
<meta name="robots" content="noindex, follow">

<!--
  THIS DOMAIN NOW FORWARDS TO jr.rumyfriend.com, AND THE REASON IS SIGN-IN.

  rumyfriendjr.com used to serve a clone of jr.rumyfriend.com. The clone was
  faithful -- same 30 games, same Ranks, same markup -- but two things could
  never work on it, and both come from one fact: rumyfriendjr.com is a
  different registrable domain from rumyfriend.com.

    * SIGN-IN. The session lives in `rf_id` / `rf_sess`, set with
      `domain=.rumyfriend.com; SameSite=Lax`. A different registrable domain
      never receives them, and Lax means even asking the server cross-site
      does not carry them. So a child already signed in on RumyFriend arrived
      here and was told "Sign in to see your friends."
    * FRIEND CHAT. rumyfriend.com/friend-messenger answers with
      `frame-ancestors https://jr.rumyfriend.com`, so the browser refused to
      embed it here -- measured from both hosts, only this one refused. The
      friends LIST arrives through that same frame, so the roster was empty
      too.

  jr.rumyfriend.com is a subdomain of rumyfriend.com and has neither problem:
  the cookies reach it and the messenger may be framed by it. Sending people
  there fixes sign-in, chat and the friends list at once, with no workaround
  anywhere and no divergence from the page the owner named as the source of
  truth.

  WHAT STAYS HERE, AND MUST: /privacy, /privacy-and-terms, /support and
  /delete are separate files, are NOT redirected, and are linked from App
  Store Connect. Breaking them would break the App Store listing.

  The query string and fragment are carried across, so a shared link that
  points at a game or a room still lands where it meant to.
-->

<meta http-equiv="refresh" content="0; url=https://jr.rumyfriend.com/">
<script>
  // Runs before the meta refresh in practice, and unlike the meta tag it can
  // carry the query string and fragment. `replace` rather than `assign`, so the
  // back button returns wherever the child came from instead of bouncing them
  // forward again.
  (function () {
    try {
      var to = "https://jr.rumyfriend.com/" + (location.search || "") + (location.hash || "");
      location.replace(to);
    } catch (e) {
      // Any failure leaves the meta refresh and the link below, which is
      // exactly why both still exist.
    }
  })();
</script>

<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center; text-align: center;
    padding: 24px;
    background: #d8e8be;
    color: #24331c;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #3d5130; }
  a.go {
    display: inline-block; padding: 14px 22px; border-radius: 999px;
    background: #24331c; color: #fff; text-decoration: none; font-weight: 700;
  }
</style>
</head>
<body>
  <main>
    <h1>RumyFriend Jr has moved</h1>
    <p>Taking you to jr.rumyfriend.com&hellip;</p>
    <!-- The no-JS, no-meta-refresh fallback. A child must never be stuck on a
         blank page because a redirect did not fire. -->
    <a class="go" href="https://jr.rumyfriend.com/">Go to RumyFriend Jr</a>
  </main>
</body>
</html>
